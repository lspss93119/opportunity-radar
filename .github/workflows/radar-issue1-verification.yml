name: Radar Issue 1 verification
on:
  push:
    branches:
      - fix/radar-alert-delivery-integrated-20261017
  pull_request:
    branches:
      - feature/radar-v1
  workflow_dispatch:

jobs:
  non-live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Focused Issue 1 tests
        run: uv run python -m pytest -q tests/test_alert_worker.py tests/test_storage_sqlite.py tests/test_anomaly_alerts.py tests/test_anomaly_monitor_v2.py tests/test_manual_opportunity.py tests/test_manual_opportunity_integration.py tests/test_manual_opportunity_monitor.py tests/test_spread_monitor.py tests/test_app.py -m 'not live'
      - name: All non-Live tests
        run: uv run python -m pytest -q -m 'not live'
      - name: Syntax compilation
        run: uv run python -m compileall -q src tests
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
