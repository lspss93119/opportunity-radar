name: Radar Issue 1 verification
on:
  push:
    branches:
      - fix/radar-alert-delivery-integrated-20261017
  pull_request:
    branches:
      - feature/radar-v1
  workflow_dispatch:

jobs:
  non-live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Focused Issue 1 tests
        run: uv run python -m pytest -q tests/test_alert_worker.py tests/test_storage_sqlite.py tests/test_anomaly_alerts.py tests/test_anomaly_monitor_v2.py tests/test_manual_opportunity.py tests/test_manual_opportunity_integration.py tests/test_manual_opportunity_monitor.py tests/test_spread_monitor.py tests/test_app.py -m 'not live'
      - name: All non-Live tests
        continue-on-error: true
        run: uv run python -m pytest -q -m 'not live'
      - name: Syntax compilation
        run: uv run python -m compileall -q src tests
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Baseline six failures on unchanged base branch
        run: |
          git fetch --no-tags origin feature/radar-v1
          git worktree add --detach /tmp/radar-base origin/feature/radar-v1
          cd /tmp/radar-base
          uv run --project . --group dev python -m pytest -q 'tests/test_dashboard.py::test_pair_ui_summary_chart_and_range_state' 'tests/test_dashboard.py::test_pair_downsampling_preserves_unavailable_mean_break[svg]' 'tests/test_hyperliquid_websocket.py::test_hyperliquid_non_l2_messages_do_not_reset_silence_watchdog' -m 'not live'

