[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Read-only personal market opportunity radar"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "pydantic>=2.9,<3",
  "pyarrow>=17,<22",
  "pytz>=2024.1,<2027",
  "PyYAML>=6.0,<7",
  "websockets>=13,<16",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: use the public venue APIs and network access",
]
